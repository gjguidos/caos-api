
name: CAOS Release

on:
  push:
    branches:
      - master
      - alpha

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Checkout released version
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin --tags
          git checkout "v${RELEASE_VERSION}"

      - name: Resolve build metadata
        if: steps.release.outputs.version != ''
        id: metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.release.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CAOS API
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/gjguidos/caos-api:${{ steps.release.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_REVISION=${{ steps.metadata.outputs.revision }}
            APP_CHANNEL=${{ steps.metadata.outputs.channel }}